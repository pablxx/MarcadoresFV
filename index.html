<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Franz Vicerrector | Innovación que inspira</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            text-align: center;
        }

        .hero-image {
            max-width: 350px;
            width: 100%;
            height: auto;
            margin-bottom: 1rem;
            user-select: none;
            -webkit-user-drag: none;
        }

        .social-title {
            font-size: 1.4rem;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #1351a7 0%, #e50505 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

         .social-title-sm {
            font-size: 1.2rem;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #1351a7 0%, #e50505 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .social-container {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background-color: #f0f2f5;
            color: #1351a7; /* Azul corporativo por defecto */
            font-size: 1.6rem;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
        }

        .social-btn:hover {
            transform: translateY(-5px);
            color: #ffffff;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
        }

        .social-btn.whatsapp:hover {
            background-color: #25D366;
        }

        .social-btn.facebook:hover {
            background-color: #1877F2;
        }

        .social-btn.instagram:hover {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }

        .social-btn.tiktok:hover {
            background-color: #000000;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            width: 100%;
            max-width: 280px;
        }

        .action-buttons a {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            width: 100%;
            height: 52px;
            padding: 0 22px;
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1;
            text-decoration: none;
            border-radius: 30px;
            box-sizing: border-box;
            box-shadow: 0 4px 12px rgba(19, 81, 167, 0.25);
            transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
        }

        .action-buttons a i {
            width: 1.35em;
            flex-shrink: 0;
            text-align: center;
            font-size: 1.1em;
        }

        .btn-gradient {
            overflow: hidden;
            background: linear-gradient(135deg, #1351a7 0%, #e50505 80%);
        }

        .btn-gradient::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            box-shadow: 0 0 0 0 rgba(254, 0, 0, 0.45);
            animation: pulse-glow 2.5s infinite;
            pointer-events: none;
        }

        .btn-gradient::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            animation: shine 3s infinite;
            pointer-events: none;
        }

        .btn-gradient:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(19, 81, 167, 0.35);
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(254, 0, 0, 0.45); }
            70% { box-shadow: 0 0 0 12px rgba(227, 5, 5, 0); }
            100% { box-shadow: 0 0 0 0 rgba(227, 5, 5, 0); }
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        .btn-app {
            background-color: #1351a7;
        }

        .btn-app:hover {
            transform: translateY(-3px);
            background-color: #0e3c7a;
            box-shadow: 0 6px 16px rgba(19, 81, 167, 0.35);
        }
        
        .fade-in {
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="fade-in">

    <img src="FranzHero.jpeg" alt="Franz Vicerrector" class="hero-image">

    <h2 class="social-title">¡Sígueme en estas redes!</h2>
    
    <div class="social-container">

            <i class="fa-brands fa-whatsapp"></i>
        </a>
        <a href="https://www.facebook.com/share/1DScV9997u/" target="_blank" class="social-btn facebook" aria-label="Facebook">
            <i class="fa-brands fa-facebook-f"></i>
        </a>
        <a href="https://www.instagram.com/franzvillalpando?stkn=YmRyaWJ1czB1NXV6" target="_blank" class="social-btn instagram" aria-label="Instagram">
            <i class="fa-brands fa-instagram"></i>
        </a>
        <a href="https://www.tiktok.com/@franz.villalpando?_r=1&_t=ZS-99zMH3grAOt" target="_blank" class="social-btn tiktok" aria-label="TikTok">
            <i class="fa-brands fa-tiktok"></i>
        </a>
    </div>

    <div class="action-buttons">
        <a href="plan-trabajo.html" class="btn-gradient">
            <i class="fa-solid fa-file-lines"></i> Plan de trabajo
        </a>

        <a href="/app/" class="btn-app">
            <i class="fa-solid fa-download"></i> Descargar app
        </a>

        <a href="/ra/index.html" class="btn-app"><i class="fa-solid fa-mobile-screen-button"></i>Abrir Experiencia RA</a>
    </div>

    
</body>
</html>
