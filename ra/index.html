<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,minimum-scale=1,maximum-scale=1"><title>Franz Vice- Realidad Aumentada</title><script crossorigin="anonymous" src="./external/runtime/runtime.js"></script><script src="https://jsdelivr.net" async crossorigin="anonymous" data-preload-chunks="slam"></script><script src="https://jsdelivr.net" crossorigin="anonymous"></script><style>/* Forzamos a que el cuerpo no corte los elementos hijos */
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    }

    /* CONTENEDOR FLOTANTE PARA LOS BOTONES (Hotspots) */
    #hotspots-container {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 450px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      z-index: 99999 !important; /* Capa ultra alta por encima del canvas de la cámara */
      pointer-events: auto !important; /* Obliga al navegador a aceptar clics táctiles */
    }

    /* TARJETA DE INFORMACIÓN INFERIOR */
    #ar-ui {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      max-width: 400px;
      background: rgba(15, 23, 42, 0.95);
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
      border-radius: 16px;
      text-align: left;
      display: none; /* Se activa dinámicamente por JS */
      z-index: 99999 !important;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      pointer-events: auto !important;
    }</style></head><body><div id="hotspots-container"></div><div id="ar-ui"><h3 id="ui-title" style="margin: 0 0 6px 0; color: #38bdf8; font-size: 18px;"></h3><p id="ui-desc" style="margin: 0; font-size: 14px; line-height: 1.5; color: #cbd5e1;"></p></div><script src="bundle.js"></script></body></html>
