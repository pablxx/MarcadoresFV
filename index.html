<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Franz Vice | Próximamente</title>
    <style>
        /* Reseteo básico y fondo */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0d1117; /* Tono oscuro tipo GitHub/Dev */
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #c9d1d9;
            text-align: center;
        }

        /* Título con efecto degradado */
        h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #2c0fad 0%, #c10d0d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            padding: 0 20px;
        }

        /* Subtítulo */
        p {
            font-size: 1.2rem;
            color: #8b949e;
            max-width: 500px;
            margin-bottom: 40px;
            padding: 0 20px;
            line-height: 1.5;
        }

        .btn-ra {
            display: inline-block;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #eaebed;
            background: #2c0fad;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 4px 15px #2c0fad;
            transition: all 0.3s ease;
        }

        .btn-ra:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(24, 35, 188, 0.5);
            background: #293c89;
        }
    </style>
</head>
<body>

    <h1>Sitio en Construcción</h1>
    <p>Estamos preparando la página. Por ahora, puedes probar la experiencia de Realidad Aumentada escaneando el código.</p>
    
    <a href="/ra" class="btn-ra">Abrir Experiencia RA</a>

</body>
</html>
